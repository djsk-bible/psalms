<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F5DCBD">
<meta name="description" content="시편 150편 읽기 체크">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="시편 읽기표">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>시편 읽기표</title>

<style>
html{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
body{margin:0}
/* 한 장으로 흐르는 화면: 위는 따뜻한 빛(진도), 아래는 오늘 읽을 말씀. 상자 없이 여백과 새싹 제목으로 나눔 */
:root{
  --paper:#FCF8F3; --glow:#F5DCBD; --glow2:#F9E8D3;
  --ink:#33261D; --sub:#8C7B6C; --faint:#B9AA9B; --line:#EFE2D2;
  --amber:#E0913A; --amberD:#B5661C; --soft:#FBEBD8; --track:#EFD9BF;
  --chipLine:#E6D9CA; --chipBg:transparent; --sheet:#FFFCF8; --toast:#33261D; --toastFg:#FFF6EC; --toastAc:#FFC98A;
  --sys:-apple-system,BlinkMacSystemFont,system-ui,"Apple SD Gothic Neo","Noto Sans KR","Noto Sans CJK KR",sans-serif;
  --side:clamp(20px,9vw,40px); --ring:136px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#1E1814; --glow:#3A2817; --glow2:#2A1F17; --ink:#F3E9DF; --sub:#B8A796; --faint:#8C7D70; --line:#3A2F27;
  --amber:#E39A48; --amberD:#F0B26B; --soft:#3A2A1C; --track:#3B2F25; --chipLine:#4A3C31; --sheet:#28201A;
  --toast:#F3E9DF; --toastFg:#2A1F17; --toastAc:#B5661C; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#1E1814; --glow:#3A2817; --glow2:#2A1F17; --ink:#F3E9DF; --sub:#B8A796; --faint:#8C7D70; --line:#3A2F27;
  --amber:#E39A48; --amberD:#F0B26B; --soft:#3A2A1C; --track:#3B2F25; --chipLine:#4A3C31; --sheet:#28201A;
  --toast:#F3E9DF; --toastFg:#2A1F17; --toastAc:#B5661C; color-scheme:dark}
@media (max-width:380px){:root{--ring:118px}}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--sys);letter-spacing:-.2px;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible{outline:2.5px solid var(--amber);outline-offset:3px;border-radius:999px}
.app{max-width:440px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;
  background:linear-gradient(180deg,var(--glow) 0,var(--glow2) 210px,var(--paper) 370px)}
/* 머리 */
.hd{display:flex;justify-content:space-between;align-items:center;padding:24px var(--side) 0}
.hd h1{margin:0;font-size:22px;font-weight:800;letter-spacing:-.6px}
.gear{width:40px;height:40px;margin-right:-9px;display:flex;align-items:center;justify-content:center;border-radius:50%}
/* 진도 */
.hero{display:flex;align-items:center;gap:22px;padding:24px var(--side) 0}
.ring{position:relative;width:var(--ring);height:var(--ring);flex-shrink:0}
.ring svg{display:block;width:100%;height:100%;transform:rotate(-90deg)}
.ring .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring small{font-size:13px;color:var(--sub);font-weight:600}
.ring b{font-size:calc(var(--ring)*.25);font-weight:800;line-height:1.1;letter-spacing:-1px;font-variant-numeric:tabular-nums}
.ring b em{font-style:normal;font-size:.47em;margin-left:1px}
.ring span{font-size:13px;color:var(--sub)}
.htx{flex:1;min-width:0}
.msg{font-size:18px;font-weight:700;line-height:1.45;letter-spacing:-.4px;white-space:pre-line;text-wrap:balance}
.pill{display:inline-block;width:max-content;max-width:100%;background:var(--amber);color:#fff;font-weight:700;font-size:13.5px;border-radius:999px;padding:3px 11px;margin-top:10px;line-height:1.5}
.rng{font-size:15.5px;font-weight:700;margin-top:6px}
.day{font-size:13.5px;color:var(--amberD);margin-top:3px}
@media (max-width:380px){.msg{font-size:16.5px}.hero{gap:16px}}
/* 오늘 */
.today{padding:34px var(--side) 0}
.th{display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.th>div:first-child{min-width:0}
.th h2{white-space:nowrap}
.lbl{display:flex;align-items:baseline;gap:4px;font-size:15px;font-weight:700;color:var(--amberD)}
.lbl svg{position:relative;top:2px;margin-left:-4px;flex-shrink:0}
.th h2{margin:2px 0 0;font-size:30px;font-weight:800;letter-spacing:-1px;line-height:1.2;font-variant-numeric:tabular-nums}
.th h2 .ps{font-size:26px;margin-right:8px;letter-spacing:-.5px}
.th h2 .t{font-size:24px;font-weight:700;color:var(--sub);margin:0 6px}
.th h2 .u{font-size:17px;margin-left:3px;letter-spacing:0}
.cnt{font-size:15px;color:var(--sub);white-space:nowrap;margin-bottom:4px}
.cnt b{font-size:22px;font-weight:800;color:var(--ink);letter-spacing:-.5px}
.tip{text-align:center;font-size:14px;color:var(--sub);margin-top:16px}
.big{display:grid;justify-content:center;gap:12px;margin-top:10px}
.big .ch{width:100%;aspect-ratio:1;font-size:16px}
.grid{display:grid;grid-template-columns:repeat(8,1fr);gap:8px 6px;margin-top:10px}
.grid .ch{width:100%;aspect-ratio:1;max-width:100%;font-size:13px}
.ch{border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--sub);box-shadow:inset 0 0 0 1.5px var(--chipLine);font-variant-numeric:tabular-nums;transition:background .12s}
.ch.on{background:var(--amber);color:#fff;box-shadow:none}
.grp{display:flex;justify-content:space-between;align-items:center;width:100%;margin-top:12px;padding:12px 14px;border-radius:12px;background:var(--soft);font-size:14px;color:var(--sub)}
.grp b{color:var(--ink);font-size:15px;margin-right:6px}
.sug{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:6px 10px;margin-top:16px;font-size:14px;font-weight:600}
.sug .no{color:var(--sub);padding:6px 4px}
.sug .yes{color:#fff;background:var(--amber);border-radius:999px;padding:7px 14px;font-weight:700}
.btnrow{text-align:center;margin-top:20px}
.all{display:inline-flex;align-items:center;gap:6px;height:42px;padding:0 18px;border-radius:999px;font-size:15px;font-weight:700;color:var(--amberD);background:var(--soft)}
.all.done{background:transparent;box-shadow:inset 0 0 0 1.5px var(--chipLine);cursor:default}
.note{text-align:center;font-size:15px;color:var(--sub);line-height:1.6;margin-top:14px}
.note b{color:var(--ink)}
.small{font-size:13px;color:var(--faint);text-align:center;margin-top:12px}
/* 아래 줄 */
.foot{margin-top:auto;padding:40px var(--side) 30px;display:flex;justify-content:center;align-items:center;font-size:13px}
.foot button{display:flex;align-items:center;gap:3px;padding:6px 12px;color:var(--sub);font-weight:600}
.foot button b{color:var(--ink)}
.foot .bar{width:1px;height:14px;background:var(--chipLine)}
/* 알림 띠 */
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));width:min(400px,calc(100% - 32px));
  background:var(--toast);color:var(--toastFg);border-radius:14px;padding:10px 10px 10px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:14.5px;z-index:20;box-shadow:0 10px 24px rgba(0,0,0,.18)}
.toast button{color:var(--toastAc);font-weight:700;padding:8px 10px;white-space:nowrap}
/* 시험 도구 */
.tbtn{position:fixed;left:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));font-size:12px;font-weight:700;color:var(--sub);padding:6px 10px;border-radius:999px;box-shadow:inset 0 0 0 1.3px var(--chipLine);background:var(--paper);z-index:15}
.shade{position:fixed;inset:0;background:rgba(30,20,10,.35);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:440px;max-height:88vh;overflow:auto;background:var(--sheet);border-radius:22px 22px 0 0;padding:20px 20px calc(24px + env(safe-area-inset-bottom,0px))}
.sheet h3{margin:0 0 4px;font-size:18px}
.sheet .hint{font-size:13px;color:var(--sub);margin:0 0 12px}
.trow{padding:12px 0;border-top:1px solid var(--line)}
.trow>span{display:block;font-size:13.5px;color:var(--sub);margin-bottom:8px;font-weight:600}
.tctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tctl button{padding:8px 12px;border-radius:999px;box-shadow:inset 0 0 0 1.3px var(--chipLine);font-size:14px;font-weight:600}
.tctl button.on{background:var(--amber);color:#fff;box-shadow:none}
.tctl .v{font-size:15px;font-weight:700;padding:0 6px;font-variant-numeric:tabular-nums}
.close{width:100%;margin-top:14px;height:46px;border-radius:999px;background:var(--amber);color:#fff;font-weight:700;font-size:15px}
/* 2단계: 시작화면 · 설정 */
.pg{flex:1;display:flex;flex-direction:column}
.bk{display:flex;align-items:center;gap:6px;padding:20px 18px 0 12px}
.bk button{width:40px;height:40px;display:flex;align-items:center;justify-content:center;border-radius:50%}
.bk h1{margin:0;font-size:22px;font-weight:800;letter-spacing:-.5px}
.sec{display:flex;align-items:baseline;gap:4px;margin:30px var(--side) 0;font-size:16px;font-weight:700;color:var(--amberD)}
.sec svg{position:relative;top:2px;margin-left:-4px;flex-shrink:0}
.srow{display:flex;justify-content:space-between;align-items:center;gap:12px;width:calc(100% - 2*var(--side));margin:0 var(--side);padding:16px 0;border-bottom:1px solid var(--line);font-size:17px;font-weight:600;text-align:left}
.srow small{display:block;font-size:14.5px;color:var(--sub);font-weight:500;margin-top:2px}
.srow .v{font-size:16px;color:var(--amberD);font-weight:700;white-space:nowrap}
.srow .gt{color:var(--faint);font-size:18px}
.rad{margin:6px var(--side) 0}
.rad button{display:flex;gap:12px;align-items:flex-start;width:100%;padding:12px 0;text-align:left;border-radius:12px}
.rad i{width:24px;height:24px;border-radius:50%;box-shadow:inset 0 0 0 2px var(--chipLine);flex-shrink:0;margin-top:1px;position:relative}
.rad .on i{box-shadow:inset 0 0 0 2px var(--amber)}
.rad .on i:after{content:"";position:absolute;inset:5px;border-radius:50%;background:var(--amber)}
.rad b{display:block;font-size:17px;font-weight:700}
.rad span{font-size:14.5px;color:var(--sub);line-height:1.55}
.rad span em{white-space:nowrap;font-style:normal;color:var(--amberD);font-weight:700}
.seg{display:flex;margin:12px var(--side) 0;background:var(--soft);border-radius:999px;padding:4px}
.seg button{flex:1;height:40px;border-radius:999px;font-size:14.5px;font-weight:700;color:var(--sub)}
.seg button.on{background:var(--sheet);color:var(--ink);box-shadow:0 2px 6px rgba(150,100,50,.15)}
.q2{margin:16px var(--side) 0;font-size:16px;font-weight:700}
.danger{margin:28px var(--side) 40px;font-size:16px;color:var(--sub);font-weight:600;text-decoration:underline;text-underline-offset:3px;align-self:flex-start}
/* 시작화면 */
.st .hero{padding-top:28px}
.st .rmsg{font-size:18px;font-weight:700;line-height:1.45;letter-spacing:-.4px}
.pick{display:flex;justify-content:space-between;gap:4px;padding:0 var(--side);margin-top:14px}
.pick button{width:48px;height:48px;border-radius:50%;font-size:17px;font-weight:800;box-shadow:inset 0 0 0 1.5px var(--chipLine);background:var(--sheet);font-variant-numeric:tabular-nums}
.pick button.on{background:var(--amber);color:#fff;box-shadow:none}
.pickl{display:flex;justify-content:space-between;gap:4px;padding:0 var(--side);margin-top:6px}
.pickl span{width:48px;text-align:center;font-size:12.5px;color:var(--sub)}
.own{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:16px;font-size:14.5px;color:var(--sub)}
.own input{width:76px;height:40px;border-radius:12px;border:0;box-shadow:inset 0 0 0 1.5px var(--chipLine);background:var(--sheet);color:var(--ink);font:700 17px var(--sys);text-align:center}
.own input:focus{outline:2.5px solid var(--amber);outline-offset:1px}
.own.on input{box-shadow:inset 0 0 0 2px var(--amber)}
.dt{display:flex;justify-content:space-between;align-items:center;margin:22px var(--side) 0;padding:14px 0;border-bottom:1.5px solid var(--line);font-size:16px;font-weight:600}
.dIn{-webkit-appearance:none;appearance:none;font:700 16px var(--sys);color:var(--amberD);background:var(--soft);border:0;border-radius:12px;padding:0 14px;height:46px;min-width:160px;text-align:center;cursor:pointer}
.dIn::-webkit-date-and-time-value{text-align:center}
.dIn:focus{outline:2.5px solid var(--amber);outline-offset:2px}
.dIn.wide{display:block;width:100%;margin-top:14px;font-size:17px}
.dsub{text-align:center;font-size:15px;color:var(--sub);margin-top:8px}
.go{align-self:center;margin:auto 0 40px;padding:0 44px;height:50px;border-radius:999px;background:var(--amber);color:#fff;font-size:16.5px;font-weight:700}
.go:disabled{opacity:.45;cursor:default}
.spacer{height:36px}
/* 시트 공통 */
.sheet p{font-size:14.5px;color:var(--sub);line-height:1.6;margin:6px 0 0}
.sheet p b{color:var(--ink)}
.sheet .pick{padding:0;margin-top:16px}
.sbtns{display:flex;gap:8px;margin-top:20px}
.sbtns button{flex:1;height:48px;border-radius:999px;font-weight:700;font-size:15px;background:var(--soft);color:var(--amberD)}
.sbtns button.pri{background:var(--amber);color:#fff}

/* 3단계: 체크표 · 지난 기록 · 백업 */
.nag{display:flex;align-items:center;gap:8px;margin:30px var(--side) 0;padding:10px 8px 10px 14px;border-radius:14px;background:var(--soft);font-size:14px;color:var(--amberD);font-weight:600}
.nag span{flex:1}
.nag button{font-weight:700;padding:6px 8px;color:var(--ink)}
.nag button:last-child{color:var(--sub);font-weight:500}
.nag+.foot{padding-top:16px}
.bsum{display:flex;justify-content:space-between;align-items:flex-end;padding:16px var(--side) 0;gap:12px}
.bsum .n{font-size:15px;color:var(--sub)}
.bsum .n b{font-size:26px;font-weight:800;color:var(--ink);letter-spacing:-.5px;margin-right:2px}
.bsum .p{font-size:14px;color:var(--sub);text-align:right;line-height:1.5}
.miss{margin:14px var(--side) 0;padding:11px 14px;border-radius:14px;background:var(--soft);font-size:14px;color:var(--amberD);font-weight:600;line-height:1.55}
.lg{display:flex;gap:14px;padding:14px var(--side) 0;font-size:13px;color:var(--sub)}
.lg span{display:flex;align-items:center;gap:5px}
.lg .d{width:13px;height:13px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--chipLine)}
.lg .d.on{background:var(--amber);box-shadow:none}
.lg .d.ms{background:var(--soft);box-shadow:inset 0 0 0 1.5px #EBB173}
.lg .d.td{box-shadow:inset 0 0 0 2px var(--amber)}
.bgrid{display:grid;grid-template-columns:repeat(10,1fr);gap:6px 5px;padding:12px calc(var(--side) - 14px) 0}
.bgrid .ch{width:100%;aspect-ratio:1;font-size:11.5px;box-shadow:inset 0 0 0 1.2px var(--chipLine);color:var(--faint)}
.bgrid .ch.on{color:#fff}
.bgrid .ch.ms{background:var(--soft);color:var(--amberD);box-shadow:inset 0 0 0 1.5px #EBB173}
.bgrid .ch.td{color:var(--ink);box-shadow:inset 0 0 0 2px var(--amber)}
.hsum{display:flex;justify-content:space-between;align-items:flex-end;padding:18px var(--side) 0}
.hsum small{font-size:14px;color:var(--sub)}
.hsum h2{margin:2px 0 0;font-size:30px;font-weight:800;letter-spacing:-.8px}
.hsum h2 span{font-size:18px;margin-left:3px}
.hsum p{margin:0;font-size:14px;color:var(--sub);text-align:right;line-height:1.5}
.hnow{display:flex;align-items:center;gap:12px;width:calc(100% - 2*var(--side));margin:20px var(--side) 0;padding:12px 0;text-align:left}
.hnow .tx{flex:1}
.hnow b{display:block;font-size:15.5px;font-weight:800;color:var(--amberD)}
.hnow .tx>span{font-size:13.5px;color:var(--sub)}
.hnow .gt,.rw .gt{color:var(--faint);font-size:18px}
.yr{display:flex;justify-content:space-between;align-items:center;width:calc(100% - 2*var(--side));margin:16px var(--side) 0;padding:12px 0 8px;border-bottom:1.5px solid var(--line);font-size:15px;font-weight:800}
.yr span:last-child{font-size:13.5px;color:var(--sub);font-weight:600}
.yr.cl{font-weight:700;color:var(--sub);border-bottom-width:1px}
.rw{display:flex;align-items:center;gap:10px;width:calc(100% - 2*var(--side));margin:0 var(--side);min-height:46px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14.5px;text-align:left}
.rw .rk{width:20px;height:20px;border-radius:50%;background:var(--amber);color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.rw .rk svg{width:12px;height:12px}
.rw b{width:46px;font-weight:800;flex-shrink:0}
.rw .d{flex:1;color:var(--sub);min-width:0}
.rw .d small{display:block;font-size:12.5px;color:var(--amberD)}
.rw .nn{font-size:13.5px;color:var(--sub)}
.more{display:block;margin:12px auto 0;font-size:13.5px;color:var(--sub);font-weight:600;padding:6px 10px}
.fbtn{position:relative;display:flex;align-items:center;justify-content:center;height:48px;margin-top:16px;border-radius:999px;background:var(--soft);color:var(--amberD);font-weight:700;font-size:15px;cursor:pointer}
.fbtn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.paste{display:block;width:100%;height:84px;margin-top:10px;border:0;border-radius:12px;box-shadow:inset 0 0 0 1.5px var(--chipLine);background:var(--paper);color:var(--ink);font:13px var(--sys);padding:10px;resize:none}
.cpy{position:absolute;left:-9999px;top:0}
.sheet .small{text-align:left}

.ringBtn{display:block;border-radius:50%;flex-shrink:0;transition:transform .12s}
.ringBtn:active{transform:scale(.97)}
.ringBtn:focus-visible{outline-offset:4px}
.bsug{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));width:min(408px,calc(100% - 32px));z-index:18;
  display:flex;flex-wrap:wrap;align-items:center;justify-content:flex-end;gap:6px 8px;padding:12px 12px 12px 16px;border-radius:16px;background:var(--sheet);box-shadow:0 10px 28px rgba(90,60,30,.18),inset 0 0 0 1px var(--line);font-size:14.5px;font-weight:600}
.bsug span{flex:1 1 100%}
.bsug .no{color:var(--sub);padding:8px 10px}
.bsug .yes{color:#fff;background:var(--amber);border-radius:999px;padding:9px 16px;font-weight:700}
.hint2{text-align:center;font-size:13.5px;color:var(--amberD);margin:8px 0 0}
.set .sec{margin:18px var(--side) 0;padding-top:18px;border-top:1px solid var(--line)}
.set .bk+.sec{border-top:0;padding-top:0;margin-top:16px}
.set .srow{padding:13px 0}
.set .srow:has(+ .sec){border-bottom:0}
.set #setPace,.set #setStart{font-size:18.5px;padding:14px 0}
.set #setPace .v,.set #setStart .v{font-size:17.5px}
.set .rad{margin-top:2px}
.set .rad button{padding:9px 0}
.set .danger{margin:22px var(--side) 36px}
.sbtns button:disabled{opacity:.45}
.undo{margin-top:10px;font-size:14px;color:var(--sub);text-decoration:underline;text-underline-offset:3px;padding:6px 8px}
.secret{margin-left:auto;margin-right:2px;width:40px;height:40px;display:flex;align-items:center;justify-content:center;border-radius:50%}
.secret i{width:12px;height:12px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--chipLine)}
/* 4단계: 설치 안내 */

<script>
(function(){

var KEY="psalm-reading-v1";
var DOW=["일","월","화","수","목","금","토"];
var PACES=[3,5,10,20,50,150];
var SPR='<svg width="30" height="22" viewBox="0 0 26 19" aria-hidden="true"><path d="M13 18V9" stroke="var(--amber)" stroke-width="1.8"/><path d="M13 10C13 5 9 2 4 2c0 5 4 8 9 8z" fill="#EBB173"/><path d="M13 8c0-4 3-6 8-6 0 4-3 6-8 6z" fill="var(--amber)"/></svg>';

var GEAR='<svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>';
var CHK='<svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>';
var CHV='<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>';

/* ---------- 날짜 도우미 ---------- */
function ymd(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function parse(s){var p=s.split("-");return new Date(+p[0],+p[1]-1,+p[2])}
function add(d,n){var x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()+n);return x}
function diff(a,b){return Math.round((parse(ymd(b))-parse(ymd(a)))/864e5)}
function md(d){return (d.getMonth()+1)+"월 "+d.getDate()+"일"}
function mdw(d){return md(d)+"("+DOW[d.getDay()]+")"}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}

/* ---------- 저장 ---------- */
/* plan: start=이번 계획이 적용되는 첫날, offset=그 전까지 날짜로 지나간 편수, cycleStart=이번 1독을 시작한 날 */
var S=null;
function load(){try{var r=localStorage.getItem(KEY);if(r)return JSON.parse(r)}catch(e){}return null}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function realToday(){var n=new Date();return new Date(n.getFullYear(),n.getMonth(),n.getDate())}
function today(){return add(realToday(),S.fake||0)}
function blank(){return {plan:null,done:0,checks:[],history:[],doneOn:null,since:null,lastBackup:null,nag:null,anchor:null,ask:null,last:null,fake:0,big:false}}
function demo(){
  var t=realToday(),c=[],st=ymd(add(t,-8));
  for(var i=1;i<=42;i++) if([17,23,38].indexOf(i)<0) c.push(i);
  var h=[{n:1,start:ymd(add(t,-70)),end:ymd(add(t,-40)),pace:5,missed:[]},{n:2,start:ymd(add(t,-39)),end:ymd(add(t,-9)),pace:5,missed:[64,101]}];
  return {plan:{pace:5,start:st,offset:0,cycleStart:st,mode:"date",sunRest:false},done:2,checks:c,history:h,doneOn:null,since:ymd(add(t,-70)),lastBackup:null,nag:null,anchor:null,ask:null,last:ymd(t),fake:0,big:false};
}
function validDate(v){if(typeof v!=="string"||!/^\d{4}-\d{2}-\d{2}$/.test(v))return false;var d=parse(v);return !isNaN(d)&&ymd(d)===v}
function intIn(v,a,b){v=Number(v);return Number.isInteger(v)&&v>=a&&v<=b}
function cleanList(a){if(!Array.isArray(a))return null;var o=[];a.forEach(function(k){k=Number(k);if(intIn(k,1,150)&&o.indexOf(k)<0)o.push(k)});return o}
/* 저장된 기록을 하나하나 확인해서 이상하면 null */
function normalize(o){
  if(!o||typeof o!=="object")return null;
  var out=blank();
  if(o.plan!=null){
    var p=o.plan;if(typeof p!=="object")return null;
    if(!intIn(p.pace,1,150)||!validDate(p.start))return null;
    out.plan={pace:Number(p.pace),start:p.start,cycleStart:validDate(p.cycleStart)?p.cycleStart:p.start,
      offset:intIn(p.offset,0,150)?Number(p.offset):0,mode:p.mode==="continue"?"continue":"date",sunRest:p.sunRest===true};
    if(validDate(p.overEnd))out.plan.overEnd=p.overEnd;
  }
  var c=cleanList(o.checks==null?[]:o.checks);if(c===null)return null;out.checks=c;
  out.done=intIn(o.done,0,100000)?Number(o.done):0;
  out.history=Array.isArray(o.history)?o.history.filter(function(h){return h&&validDate(h.start)&&validDate(h.end)}).map(function(h,i){
    return {n:intIn(h.n,1,100000)?Number(h.n):i+1,start:h.start,end:h.end,pace:intIn(h.pace,1,150)?Number(h.pace):0,missed:cleanList(h.missed)||[]}}):[];
  ["doneOn","since","lastBackup","last"].forEach(function(k){out[k]=validDate(o[k])?o[k]:null});
  out.nag=typeof o.nag==="string"&&/^\d{4}-\d{2}$/.test(o.nag)?o.nag:null;
  out.anchor=o.anchor&&validDate(o.anchor.date)&&intIn(o.anchor.from,1,151)?{date:o.anchor.date,from:Number(o.anchor.from)}:null;
  out.ask=o.ask&&validDate(o.ask.date)?{date:o.ask.date}:null;
  out.allMark=o.allMark&&validDate(o.allMark.date)?{date:o.allMark.date,added:cleanList(o.allMark.added)||[]}:null;
  out.fake=intIn(o.fake,-3650,3650)?Number(o.fake):0;out.obDone=o.obDone?1:0;
  if(o.ms&&typeof o.ms==="object"){out.ms={};[25,50,75].forEach(function(th){if(typeof o.ms[th]==="string")out.ms[th]=o.ms[th]})}
  return out;
}
var RAW=load(),BROKEN=false;
S=RAW?normalize(RAW):blank();
if(!S){BROKEN=true;try{localStorage.setItem(KEY+"-broken-"+Date.now(),JSON.stringify(RAW))}catch(e){}S=blank()}
if(!S.history)S.history=[];if(S.doneOn===undefined)S.doneOn=null;if(!S.ms){S.ms={};var p0=(S.checks||[]).length/150*100;[25,50,75].forEach(function(th){if(p0>=th)S.ms[th]="past"})}if(!S.since&&S.plan)S.since=S.plan.cycleStart;
var AWAY=S.last&&S.plan?diff(parse(S.last),today())>=3:false;
S.last=ymd(today());save();

/* ---------- 계산 ---------- */
function isReadP(d,sun){return !(sun&&d.getDay()===0)}
function isRead(d){return isReadP(d,S.plan.sunRest)}
function countRead(a,b){var n=0;for(var d=a;diff(d,b)>=0;d=add(d,1)) if(isRead(d)) n++;return n}
function nthReadP(from,n,sun){var d=from,k=0;for(var g=0;g<4000;g++){if(isReadP(d,sun)){k++;if(k===n)return d}d=add(d,1)}return d}
function nthRead(from,n){return nthReadP(from,n,S.plan.sunRest)}
function nextRead(d){var x=add(d,1);while(!isRead(x))x=add(x,1);return x}
function has(k){return S.checks.indexOf(k)>=0}
function leftList(){var l=[];for(var i=1;i<=150;i++) if(!has(i)) l.push(i);return l}
function compute(){
  var p=S.plan,t=today(),st=parse(p.start),cs=parse(p.cycleStart),off=p.offset||0,pace=p.pace;
  var total=Math.max(0,Math.ceil((150-off)/pace));
  var r={t:t,pace:pace,total:total,start:cs};
  r.count=S.checks.length;r.pct=Math.round(r.count/150*100);
  if(r.count>=150){r.phase="done";r.end=S.doneOn?parse(S.doneOn):t;return r}
  if(diff(cs,t)<0){r.phase="before";r.from=off+1;r.to=Math.min(off+pace,150);r.end=nthRead(st,total);r.wait=diff(t,cs);return r}
  r.rest=!isRead(t);
  r.n=countRead(cs,t)+(r.rest?1:0);
  if(p.mode==="date"){
    var nSeg=countRead(st,t)+(r.rest?1:0);
    r.end=p.overEnd&&off>=150?parse(p.overEnd):nthRead(st,Math.max(total,1));
    if(nSeg>total){r.phase="over";r.left=leftList();return r}
    r.from=off+(nSeg-1)*pace+1;r.to=Math.min(off+nSeg*pace,150);r.remain=total-nSeg;
  }else{
    var key=ymd(t),from;
    if(S.anchor&&S.anchor.date===key) from=S.anchor.from;
    else{from=1;while(from<=150&&has(from))from++;
      if(!r.rest){S.anchor={date:key,from:from};save()}}
    if(from>150){r.phase="over";r.left=leftList();r.end=t;return r}
    r.from=from;r.to=Math.min(from+pace-1,150);
    var days=Math.ceil((150-from+1)/pace);
    r.end=nthRead(r.rest?nextRead(t):t,days);r.remain=days-1;
  }
  r.phase=r.rest?"rest":"read";r.last=r.remain===0;
  r.todayDone=true;for(var k=r.from;k<=r.to;k++) if(!has(k)){r.todayDone=false;break}
  return r;
}
/* 1독 마치기: 기록에 남기고 새 1독 시작 */
function finishCycle(missed,startDate,endDate){
  var p=S.plan;
  S.history.push({n:S.done+1,start:p.cycleStart,end:endDate,pace:p.pace,missed:missed||[]});
  S.done++;S.checks=[];S.doneOn=null;S.anchor=null;S.ask=null;S.ms={};
  p.start=startDate;p.cycleStart=startDate;p.offset=0;delete p.overEnd;open50=null;save();
}
function msInit(){S.ms={};var p=S.checks.length/150*100;[25,50,75].forEach(function(th){if(p>=th)S.ms[th]="past"})}
function afterCheck(){
  AWAY=false;
  if(!S.ms)msInit();var pc=S.checks.length/150*100;
  [25,50,75].forEach(function(th){if(pc>=th&&!S.ms[th])S.ms[th]=ymd(today())});
  if(S.checks.length>=150){if(!S.doneOn)S.doneOn=ymd(today())}else S.doneOn=null;
}
function autoNext(){
  if(S.plan&&S.checks.length>=150&&S.doneOn&&diff(parse(S.doneOn),today())>0){
    var nx=nextRead(parse(S.doneOn));finishCycle([],ymd(nx),S.doneOn);return true}
  return false;
}
/* 설정을 바꿀 때: 오늘 읽을 곳은 그대로 두고 그다음부터 새 계획 */
function rebase(change){
  var r=compute(),p=S.plan,t=today(),live=r.phase==="read"||r.phase==="rest";
  change(p);
  if(r.phase==="over"){if(!p.overEnd&&r.end)p.overEnd=ymd(r.end);p.offset=150;p.start=ymd(t);S.anchor=null;save();return}
  if(live){p.offset=r.from-1;p.start=ymd(isRead(t)?t:nextRead(t))}
  S.anchor=null;save();
}
var DAILY=["오늘의 말씀으로\n하루를 세워 가요","매일의 말씀이\n믿음의 근육이 돼요","잘 걸어오고 있어요.\n오늘도 힘내세요","말씀의 습관이\n삶을 바꿔요","시작한 마음 그대로\n오늘도 함께해요","시냇가의 나무처럼\n풍성한 열매를 맺어요","지금처럼만 하면 돼요.\n끝까지 응원해요","오늘 읽은 말씀이\n내일의 힘이 돼요"];
var WELL=["오늘 분량 완료!\n정말 잘하셨어요","약속을 지킨 하루,\n수고하셨어요","오늘도 해내셨어요.\n내일 또 만나요"];
function dayNo(t){return diff(new Date(2026,0,1),t)}
function pick(list,t){var n=dayNo(t)%list.length;return list[(n+list.length)%list.length]}
function message(r){
  var c=S.done+1,key=ymd(r.t),ms=S.ms||{};
  if(r.phase==="done") return c+"독을 마쳤어요!\n정말 수고하셨어요";
  if(r.phase==="before") return "곧 시작해요.\n마음을 준비해요";
  if(r.phase==="rest") return "오늘은 주일이에요.\n예배로 쉬어 가요";
  if(r.phase==="over") return "거의 다 왔어요.\n남은 곳을 채워요";
  if(AWAY) return "다시 오셨네요.\n오늘 다시 시작해요";
  if(r.count===0) return c+"독을 시작해요.\n첫걸음을 내디뎌요";
  if(r.last&&!r.todayDone) return "오늘이면\n"+c+"독을 마쳐요";
  if(ms[75]===key) return "4분의 3을 넘었어요.\n결승선이 보여요";
  if(ms[50]===key) return "절반을 넘었어요.\n끝까지 함께 가요";
  if(ms[25]===key) return "4분의 1을 지났어요.\n좋은 출발이에요";
  if(r.todayDone) return pick(WELL,r.t);
  var after=r.count;for(var k=r.from;k<=r.to;k++) if(!has(k)) after++;
  if(r.pct<50&&after/150*100>=50) return "오늘도 다 읽으면\n절반을 넘어요";
  return pick(DAILY,r.t);
}
function rangeText(a,b){if(diff(a,b)===0)return md(a)+" 하루";return a.getMonth()===b.getMonth()&&a.getFullYear()===b.getFullYear()?md(a)+" – "+b.getDate()+"일":md(a)+" – "+md(b)}
function dayText(r){
  if(r.phase==="done") return "모두 체크했어요";
  if(r.phase==="before") return r.wait===1?"내일 시작해요":r.wait+"일 뒤에 시작해요";
  if(r.phase==="over") return "읽기 기간이 지났어요";
  if(r.phase==="rest") return "쉬는 날, "+(r.remain+1)+"일 남았어요";
  if(r.last) return r.n===1?"오늘 하루에 1독해요":"오늘이 마지막 날이에요";
  return r.n+"일째, "+r.remain+"일 남았어요";
}
function daysFor(pace){return Math.ceil(150/pace)}
function paceLabel(n){return n===150?"하루 1독":daysFor(n)+"일"}

/* ---------- 화면 ---------- */
var app=document.getElementById("app"),view=S.plan?"main":"start",sug=null,open50=null,draft=null;
function ringSvg(pct,top,mid,bot){
  var C=2*Math.PI*58,a=pct/100*C;
  return '<div class="ring"><svg viewBox="0 0 136 136" aria-hidden="true"><circle cx="68" cy="68" r="58" fill="none" stroke="var(--track)" stroke-width="10"/>'+
    (pct>0?'<circle cx="68" cy="68" r="58" fill="none" stroke="var(--amber)" stroke-width="10" stroke-linecap="round" stroke-dasharray="'+a.toFixed(1)+' 999"/>':'')+
    '</svg><div class="c"><small>'+top+'</small><b>'+mid+'</b><span>'+bot+'</span></div></div>';
}
function range(a,b){var x=[];for(var k=a;k<=b;k++)x.push(k);return x}
function chips(list){
  var n=list.length,h="";
  function one(k){return '<button type="button" class="ch'+(has(k)?' on':'')+'" data-k="'+k+'" aria-pressed="'+has(k)+'" aria-label="시편 '+k+'편">'+k+'</button>'}
  if(n<=15) return '<div class="big" style="grid-template-columns:repeat('+Math.min(n,5)+',minmax(0,50px))">'+list.map(one).join("")+'</div>';
  if(n<=50) return '<div class="grid">'+list.map(one).join("")+'</div>';
  var groups=[];for(var i=0;i<n;i+=50) groups.push(list.slice(i,i+50));
  if(open50===null){open50=0;for(var g=0;g<groups.length;g++){if(groups[g].some(function(k){return !has(k)})){open50=g;break}}}
  groups.forEach(function(gr,gi){
    var c=gr.filter(has).length;
    if(gi===open50) h+='<div class="grid">'+gr.map(one).join("")+'</div>';
    else h+='<button type="button" class="grp" data-g="'+gi+'"><span><b>'+gr[0]+'–'+gr[gr.length-1]+'편</b>'+c+' / '+gr.length+'</span><span>'+(c===gr.length?'✓ ':'')+'펼치기 ›</span></button>';
  });
  return h;
}
function fmtList(l){
  var g=[],a=l[0],p=l[0];
  for(var i=1;i<=l.length;i++){if(l[i]===p+1){p=l[i];continue}g.push(a===p?String(a):a+"–"+p);a=p=l[i]}
  return g.slice(0,3).join("·")+(g.length>3?" 등":"")+"편";
}
var bSug=null,bNo=false;
function h2(a,b){return '<h2><span class="ps">시편</span>'+(a===b?a:a+'<span class="t">~</span>'+b)+'<span class="u">편</span></h2>'}

function mainView(){
  var r=compute(),c=S.done+1,t="";

  }else if(r.phase==="rest"){
    var nr=nextRead(r.t),lab=diff(r.t,nr)===1?"내일":mdw(nr);

var stack=[],boardIdx=null,histOpen={},histMore={};

function renderView(){
  if(view==="start") app.innerHTML=startView();

/* ---------- 체크표 ---------- */
function boardView(){
  var past=boardIdx!==null?S.history[boardIdx]:null,t='';
  var title=past?past.n+'독 체크표':(S.done+1)+'독째 체크표';
  t+='<div class="pg bd"><div class="bk"><button type="button" class="bkb" aria-label="뒤로">'+BACK+'</button><h1>'+title+'</h1></div>';
  var on,miss=[],todayR=[],sumR,sumL;
  if(past){
    on=function(k){return past.missed.indexOf(k)<0};miss=past.missed.slice();
    sumL='<b>'+(150-miss.length)+'</b> / 150편 읽음';sumR=rangeText(parse(past.start),parse(past.end))+'<br>하루 '+past.pace+'편';
  }else{
    var r=compute();on=has;
    if(r.phase==="read"||r.phase==="rest"){todayR=r.phase==="read"?range(r.from,r.to):[];for(var k=1;k<r.from;k++) if(!has(k)) miss.push(k)}

    sumL='<b>'+r.count+'</b> / 150편 읽음';sumR=rangeText(r.start,r.end)+'<br>'+(r.n?r.n+'일째':'');
  }
  t+='<div class="bsum"><div class="n">'+sumL+'</div><div class="p">'+sumR+'</div></div>';
  if(miss.length) t+='<div class="miss">'+(past?'체크 안 된 곳이 '+miss.length+'편 있었어요':'지나간 날 중 체크 안 된 곳이 '+miss.length+'편 있어요')+'<br><b>'+fmtList(miss)+'</b></div>';
  t+='<div class="lg"><span><i class="d on"></i>읽음</span>'+(past?'':'<span><i class="d ms"></i>체크 안 됨</span><span><i class="d td"></i>오늘</span>')+'</div>';
  t+='<div class="bgrid">';
  for(var i=1;i<=150;i++){
    var c=on(i)?'on':(miss.indexOf(i)>=0?'ms':(todayR.indexOf(i)>=0?'td':''));
    t+=past?'<span class="ch '+c+'">'+i+'</span>':'<button type="button" class="ch '+c+'" data-bk="'+i+'" aria-pressed="'+on(i)+'" aria-label="시편 '+i+'편">'+i+'</button>';
  }
  t+='</div>';
  t+='<p class="small" style="margin-bottom:'+(bSug&&!past?'110px':'40px')+'">'+(past?'지난 기록이라 고칠 수 없어요':'번호를 누르면 여기서도 체크할 수 있어요')+'</p></div>';
  if(bSug&&!past) t+='<div class="bsug" role="group"><span>'+fmtList(bSug)+'도 읽으셨나요?</span><button type="button" class="no" id="bNo">아니요</button><button type="button" class="yes" id="bYes">함께 표시</button></div>';
  return t;
}

/* ---------- 지난 기록 ---------- */
function histView(){
  var h=S.history.slice().reverse(),r=compute(),t='';
  t+='<div class="pg hs"><div class="bk"><button type="button" class="bkb" aria-label="뒤로">'+BACK+'</button><h1>지난 기록</h1></div>';
  t+='<div class="hsum"><div><small>지금까지</small><h2>'+S.done+'<span>독 완료</span></h2></div><p>'+(S.done?'시편 '+(S.done*150).toLocaleString()+'편을<br>읽으셨어요':'첫 1독을<br>걸어가는 중이에요')+'</p></div>';
  var C=2*Math.PI*12;
  t+='<button type="button" class="hnow" data-hb="cur"><svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true" style="transform:rotate(-90deg)"><circle cx="15" cy="15" r="12" fill="none" stroke="var(--track)" stroke-width="4"/><circle cx="15" cy="15" r="12" fill="none" stroke="var(--amber)" stroke-width="4" stroke-linecap="round" stroke-dasharray="'+(r.pct/100*C).toFixed(1)+' 99"/></svg><span class="tx"><b>'+(S.done+1)+'독째 · 읽는 중</b><span>'+md(r.start)+'부터 · 하루 '+r.pace+'편 · '+r.count+'/150편</span></span><span class="gt">›</span></button>';
  if(!h.length){t+='<p class="note" style="margin-top:30px">1독을 마치면 여기에 기록이 쌓여요.</p></div>';return t}
  var years={},order=[];
  h.forEach(function(x){var y=x.end.slice(0,4);if(!years[y]){years[y]=[];order.push(y)}years[y].push(x)});
  var thisY=String(r.t.getFullYear());
  order.forEach(function(y,yi){
    var list=years[y],open=histOpen[y]!==undefined?histOpen[y]:(yi===0);
    t+='<button type="button" class="yr'+(open?'':' cl')+'" data-yr="'+y+'"><span>'+y+'년</span><span>'+list.length+'독 '+(open?'⌃':'›')+'</span></button>';
    if(!open) return;
    var show=histMore[y]?list:list.slice(0,5);
    show.forEach(function(x){
      var idx=S.history.indexOf(x),days=diff(parse(x.start),parse(x.end))+1;
      t+='<button type="button" class="rw" data-hb="'+idx+'"><span class="rk">'+CHK+'</span><b>'+x.n+'독</b><span class="d">'+rangeText(parse(x.start),parse(x.end))+(x.missed.length?'<small>체크 안 됨 '+x.missed.length+'편</small>':'')+'</span><span class="nn">'+days+'일</span></button>';
    });
    if(!histMore[y]&&list.length>5) t+='<button type="button" class="more" data-more="'+y+'">'+y+'년 기록 더 보기 ('+(list.length-5)+'개) ⌄</button>';
  });
  t+='<p class="small" style="margin-bottom:40px">누르면 그때의 체크표를 볼 수 있어요</p></div>';
  return t;
}

/* ---------- 백업 ---------- */
function backupText(){var o=JSON.parse(JSON.stringify(S));delete o.fake;return JSON.stringify({app:"psalm-reading",v:1,saved:ymd(today()),data:o})}
function canShareFile(name,txt){try{return !!(navigator.canShare&&window.File&&navigator.canShare({files:[new File([txt],name,{type:"application/json"})]}))}catch(e){return false}}
function exportSheet(){
  var txt=backupText(),name="시편읽기표-백업-"+ymd(today())+".json";
  sheet('<h3>기록 내보내기</h3><p>지금까지의 체크와 지난 기록을 <b>파일 하나</b>로 저장해요. 휴대폰을 바꾸면 새 휴대폰에서 "기록 불러오기"로 넣으면 돼요.</p>'+
    (canShareFile(name,txt)?'<div class="sbtns"><button type="button" class="pri" id="shareFile">공유하기로 보내기</button></div><p class="small" style="text-align:left">카카오톡 "나와의 채팅"이나 메일로 보내 두면 잃어버리지 않아요.</p>'+
      '<div class="sbtns"><button type="button" id="fileSave">파일로 저장하기</button></div>':'<div class="sbtns"><button type="button" class="pri" id="fileSave">파일로 저장하기</button></div>')+
    '<p class="small" style="text-align:left">모두 안 되면 아래 [복사하기]를 눌러 메모장이나 카카오톡 "나와의 채팅"에 붙여 두세요.</p>'+
    '<div class="sbtns"><button type="button" id="copyTxt">복사하기</button><button type="button" id="cx">닫기</button></div>',function(s,close){
    function mark(){S.lastBackup=ymd(today());save()}
    var sh=s.querySelector("#shareFile");
    if(sh) sh.onclick=function(){
      try{navigator.share({files:[new File([txt],name,{type:"application/json"})],title:"시편 읽기표 백업"}).then(function(){mark();toast("기록을 보냈어요")},function(e){if(!e||e.name!=="AbortError")toast("공유가 안 돼요. 파일로 저장하기를 써 주세요")})}
      catch(e){toast("공유가 안 돼요. 파일로 저장하기를 써 주세요")}
    };
    s.querySelector("#fileSave").onclick=function(){
      try{var blob=new Blob([txt],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();
        mark();toast("파일 저장을 시작했어요")}catch(e){toast("파일 저장이 안 돼요. 복사하기를 써 주세요")}
    };
    s.querySelector("#copyTxt").onclick=function(){
      var done=function(){mark();toast("기록을 복사했어요. 안전한 곳에 붙여 두세요")};
      try{navigator.clipboard.writeText(txt).then(done,function(){fallback()})}catch(e){fallback()}
      function fallback(){var ta=document.createElement("textarea");ta.value=txt;ta.className="cpy";s.appendChild(ta);ta.select();try{document.execCommand("copy");done()}catch(x){toast("길게 눌러 전체 선택 후 복사해 주세요")}}
    };
    s.querySelector("#cx").onclick=close;
  });

window.addEventListener("appinstalled",function(){installStarted=true;installEvt=null;if(obOpen())drawOb()});
setTimeout(function(){instWaitDone=true;if(obOpen())drawOb()},4000);
var ICON_SVG='<svg viewBox="0 0 100 100" aria-hidden="true"><rect width="100" height="100" fill="#E0913A"/><path d="M14 72c11-6 25-6 36 1 11-7 25-7 36-1v7c-11-6-25-6-36 1-11-7-25-7-36-1z" fill="#FFE2BF"/><path d="M14 67c11-6 25-6 36 1v5c-11-7-25-7-36-1z" fill="#fff"/><path d="M50 68c11-7 25-7 36-1v5c-11-6-25-6-36 1z" fill="#fff"/><g transform="translate(50 46) scale(.72) translate(-50 -52)"><path d="M50 80V48" stroke="#fff" stroke-width="6.5" stroke-linecap="round"/><path d="M50 52C50 36 38 26 20 26c0 17 12 26 30 26z" fill="#FFE2BF"/><path d="M50 46c0-13 10-20 28-20 0 13-10 20-28 20z" fill="#fff"/></g></svg>';
function obIc(n,s){return '<svg width="'+(s||20)+'" height="'+(s||20)+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+n+'</svg>'}
var IC_SHARE=obIc('<path d="M12 3v12M7 8l5-5 5 5"/><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/>'),IC_PLUS=obIc('<rect x="4" y="4" width="16" height="16" rx="3"/><path d="M12 8v8M8 12h8"/>'),
  IC_UP=obIc('<path d="M7 17L17 7M9 7h8v8"/>'),IC_DL=obIc('<path d="M12 4v11M7 10l5 5 5-5M5 20h14"/>'),IC_DOTS=obIc('<circle cx="5" cy="12" r="1.3" fill="currentColor"/><circle cx="12" cy="12" r="1.3" fill="currentColor"/><circle cx="19" cy="12" r="1.3" fill="currentColor"/>'),
  IC_VDOTS=obIc('<circle cx="12" cy="5" r="1.3" fill="currentColor"/><circle cx="12" cy="12" r="1.3" fill="currentColor"/><circle cx="12" cy="19" r="1.3" fill="currentColor"/>'),IC_OK=obIc('<path d="M5 12.5l4.5 4.5L19 7.5"/>',30);
var obEl=null,obForce=false;
function obOpen(){return !!(obEl&&document.body.contains(obEl))}
function head(){return '<div class="ic">'+ICON_SVG+'</div><div class="nm">시편 읽기표</div>'}
function obBody(){
  if(IS_STANDALONE) return head()+'<h2>이미 설치되어 있어요</h2><p class="pp">홈 화면의 새싹 아이콘으로 열면 돼요</p><button type="button" class="later" data-ob="close">닫기</button>';
  if(installStarted) return '<div class="chk" style="color:var(--amber)">'+IC_OK+'</div><h2>설치하고 있어요</h2><p class="pp">이 창은 닫고, 새싹 아이콘으로<br>열어 주세요</p><p class="sm">아이콘이 안 보이면 앱스 화면에서 찾아 주세요</p><button type="button" class="later" data-ob="close">알겠어요</button>';
  if(IS_IOS){
    if(IS_KAKAO) return head()+'<h2>사파리로 열어 주세요</h2><p class="pp">카카오톡 안에서는 설치가 안 되고<br>기록이 사라질 수 있어요</p><div class="steps"><div><em>1</em>오른쪽 아래 '+IC_DOTS+' 누르기</div><div><em>2</em>Safari로 열기</div></div><p class="sm">안 되면 <button type="button" data-ob="copy">주소 복사하기</button></p><button type="button" class="later" data-ob="close">그냥 여기서 볼게요</button>';
    return head()+'<h2>홈 화면에 추가해요</h2><p class="pp">아래 두 개만 눌러 주세요</p><div class="pair"><span class="k">'+IC_SHARE+'</span>공유<span class="ar">›</span><span class="k">'+IC_PLUS+'</span>홈 화면에 추가</div><p class="sm">공유 버튼은 화면 아래(또는 주소창 옆)에 있어요</p><button type="button" class="later" data-ob="close">나중에 할게요</button>';
  }
  if(IS_ANDROID&&!IS_CHROME_AND) return head()+'<h2>크롬에서 열어 주세요</h2><p class="pp">크롬에서 열어야 설치할 수 있어요</p><button type="button" class="obtn" data-ob="chrome">'+IC_UP+'크롬에서 열기</button><p class="sm">안 열리면 <button type="button" data-ob="copy">주소 복사하기</button></p><button type="button" class="later" data-ob="close">그냥 여기서 볼게요</button>';
  if(installEvt) return head()+'<h2>앱을 설치해요</h2><p class="pp">홈 화면에 새싹 아이콘이 생겨요</p><button type="button" class="obtn" data-ob="install">'+IC_DL+'앱 설치하기</button><p class="sm">1~2분 걸릴 수 있어요</p><button type="button" class="later" data-ob="close">나중에 할게요</button>';
  if(!instWaitDone) return head()+'<h2>앱을 설치해요</h2><p class="prep">설치 준비 중이에요…</p><button type="button" class="later" data-ob="close">나중에 할게요</button>';
  return head()+'<h2>앱을 설치해요</h2><p class="pp">크롬 메뉴에서 설치할 수 있어요</p><div class="steps"><div><em>1</em>오른쪽 위 '+IC_VDOTS+' 누르기</div><div><em>2</em>앱 설치 (또는 홈 화면에 추가)</div></div><button type="button" class="later" data-ob="close">나중에 할게요</button>';
}
function drawOb(){if(obOpen())obEl.querySelector(".obin").innerHTML=obBody()}
function showOb(force){
  if(obOpen())return;obForce=!!force;
  obEl=document.createElement("div");obEl.className="ob";obEl.setAttribute("role","dialog");obEl.setAttribute("aria-label","설치 안내");
  obEl.innerHTML='<div class="obin"></div>';document.body.appendChild(obEl);drawOb();
  obEl.addEventListener("click",function(e){
    var b=e.target.closest("[data-ob]");if(!b)return;var a=b.dataset.ob;
    if(a==="close"){S.obDone=1;save();obEl.remove();obEl=null;return}
    if(a==="copy"){var u=location.href.split("#")[0];
      var ok=function(){toast("주소를 복사했어요. 사파리(크롬) 주소창에 붙여 넣어 주세요")};
      try{navigator.clipboard.writeText(u).then(ok,function(){toast(u)})}catch(x){toast(u)}return}
    if(a==="chrome"){var u2=location.host+location.pathname+location.search;
      location.href="intent://"+u2+"#Intent;scheme=https;package=com.android.chrome;end";
      setTimeout(function(){if(!document.hidden)toast("안 열리면 주소 복사하기를 눌러 크롬에 붙여 넣어 주세요")},1800);return}
    if(a==="install"&&installEvt){var ev=installEvt;
      try{ev.prompt();ev.userChoice.then(function(r){if(r&&r.outcome==="accepted"){installStarted=true;installEvt=null}drawOb()},function(){})}catch(x){}return}
  });
}
/* 처음 열 때: 설치 안 된 브라우저면 안내 */
if(HOSTED&&!IS_STANDALONE&&(IS_ANDROID||IS_IOS)&&(IS_KAKAO||!S.obDone)) showOb(false);
/* 기록 보호 요청 + 오프라인 */
if(HOSTED&&"serviceWorker" in navigator&&window.isSecureContext){
  window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").then(function(r){try{r.update()}catch(e){}}).catch(function(){})});
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(function(){})}catch(e){}
}

render();
})();
</script>
</body>
</html>
